# Compiles the macOS app on every push; on a "v*" tag also attaches KBSwitch.zip to a GitHub release.
name: macOS build
on:
  push:
    paths: ["macos/**", ".github/workflows/macos.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["macos/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd macos && ./build.sh --ci
      - uses: actions/upload-artifact@v4
        with:
          name: KBSwitch
          path: macos/build/KBSwitch.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macos/build/KBSwitch.zip
